version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: setustart_postgres
    environment:
      POSTGRES_USER: setu_user
      POSTGRES_PASSWORD: setu_password
      POSTGRES_DB: setustart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu_user -d setustart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: setustart_backend
    environment:
      - PROJECT_NAME=SetuStart
      - TEAM_NAME=InnoBridge Team
      - DATABASE_URL=postgresql://setu_user:setu_password@postgres:5432/setustart_db
      - SECRET_KEY=setustart_super_secret_jwt_key_innovate_bridge_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: setustart_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
