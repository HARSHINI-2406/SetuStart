<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyCity" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="120" x2="0" y2="200">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Bright Sky & City Skyline -->
  <rect width="400" height="120" fill="url(#skyCity)"/>
  <rect x="30" y="40" width="40" height="80" fill="#64748B"/>
  <rect x="85" y="25" width="55" height="95" fill="#475569"/>
  <rect x="150" y="50" width="35" height="70" fill="#64748B"/>
  <rect x="195" y="15" width="65" height="105" fill="#334155"/>
  <rect x="270" y="35" width="50" height="85" fill="#475569"/>
  <rect x="330" y="55" width="45" height="65" fill="#64748B"/>

  <!-- Urban Road & Smart Traffic Lanes -->
  <rect y="120" width="400" height="80" fill="url(#roadGrad)"/>
  <polygon points="170,120 230,120 320,200 80,200" fill="#1E293B"/>
  <line x1="200" y1="120" x2="200" y2="200" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 8"/>
  
  <!-- Vehicles & Smart Sensors -->
  <rect x="130" y="150" width="28" height="16" rx="3" fill="#EF4444"/>
  <rect x="230" y="165" width="32" height="18" rx="3" fill="#3B82F6"/>
  <rect x="180" y="130" width="22" height="14" rx="2" fill="#10B981"/>
  
  <!-- Intelligent Transportation Signal Gantry -->
  <rect x="60" y="110" width="280" height="6" fill="#94A3B8"/>
  <circle cx="150" cy="113" r="3" fill="#10B981"/>
  <circle cx="200" cy="113" r="3" fill="#3B82F6"/>
  <circle cx="250" cy="113" r="3" fill="#10B981"/>
</svg>
