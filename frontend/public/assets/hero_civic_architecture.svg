<svg width="1600" height="400" viewBox="0 0 1600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="400">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="300">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="columnGrad" x1="0" y1="0" x2="20" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="1100" y1="50" x2="1300" y2="150">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Bright Blue Sky & Clouds -->
  <rect width="1600" height="400" fill="url(#skyGrad)"/>
  <ellipse cx="300" cy="80" rx="200" ry="40" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="700" cy="60" rx="150" ry="30" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="1200" cy="90" rx="250" ry="45" fill="#FFFFFF" opacity="0.6"/>

  <!-- Indian Civic Government Architecture Colonnade & Grand Dome -->
  <g transform="translate(850, 40)">
    <!-- Base Foundation -->
    <rect x="0" y="260" width="700" height="100" fill="#94A3B8"/>
    <rect x="20" y="240" width="660" height="20" fill="#CBD5E1"/>
    
    <!-- Main Portico & Entablature -->
    <rect x="50" y="120" width="600" height="30" fill="url(#buildingGrad)"/>
    <polygon points="50,120 350,50 650,120" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Central Grand Dome -->
    <path d="M250,120 C250,30 450,30 450,120 Z" fill="url(#domeGrad)"/>
    <rect x="340" y="10" width="20" height="30" fill="#0284C7"/>
    <circle cx="350" cy="8" r="8" fill="#F59E0B"/>

    <!-- Classical Colonnade Pillars -->
    <rect x="80" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="140" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="200" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="260" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="320" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="380" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="440" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="500" y="150" width="24" height="90" fill="url(#columnGrad)"/>
    <rect x="560" y="150" width="24" height="90" fill="url(#columnGrad)"/>
  </g>

  <!-- Front Landscaping & Greenery -->
  <path d="M700 400C850 320 1000 340 1150 400H700Z" fill="#15803D" opacity="0.8"/>
  <path d="M1050 400C1200 300 1400 320 1600 400H1050Z" fill="#166534" opacity="0.9"/>
  <circle cx="950" cy="350" r="30" fill="#22C55E"/>
  <circle cx="1020" cy="360" r="25" fill="#15803D"/>
  <circle cx="1350" cy="340" r="35" fill="#22C55E"/>
  <circle cx="1420" cy="350" r="40" fill="#166534"/>
</svg>
