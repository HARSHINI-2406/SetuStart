<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="solarSky" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Bright Blue Sky & Sun -->
  <rect width="400" height="200" fill="url(#solarSky)"/>
  <circle cx="340" cy="40" r="35" fill="#F59E0B" opacity="0.9"/>
  <circle cx="340" cy="40" r="45" fill="#FBBF24" opacity="0.4"/>

  <!-- Modern Building Roof Base -->
  <polygon points="0,110 400,110 400,200 0,200" fill="#475569"/>

  <!-- Photovoltaic Solar Panel Array -->
  <g transform="translate(30, 70)">
    <!-- Row 1 -->
    <polygon points="10,40 100,20 180,40 90,65" fill="url(#panelGrad)" stroke="#93C5FD" stroke-width="1.5"/>
    <polygon points="105,20 195,5 275,20 185,40" fill="url(#panelGrad)" stroke="#93C5FD" stroke-width="1.5"/>
    <polygon points="200,5 290,-5 365,5 280,20" fill="url(#panelGrad)" stroke="#93C5FD" stroke-width="1.5"/>

    <!-- Row 2 -->
    <polygon points="25,90 120,65 205,90 110,120" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="1.5"/>
    <polygon points="125,65 220,45 305,65 210,90" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="1.5"/>
    <polygon points="225,45 315,30 390,45 300,65" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
</svg>
